  <rect x="250" y="80" width="35" height="35" fill="#fff" rx="4"/>
  <rect x="295" y="80" width="35" height="35" fill="#fff" rx="4"/>
  <rect x="340" y="80" width="25" height="35" fill="#fff" rx="4"/>
  <rect x="250" y="125" width="120" height="10" fill="#fff" rx="2"/>
  <circle cx="100" cy="210" r="25" fill="#F57C00"/>
  <rect x="90" y="230" width="40" height="40" rx="8" fill="#333"/>
  <rect x="70" y="180" width="60" height="20" rx="10" fill="#FDB441"/>
  <circle cx="90" cy="190" r="3" fill="#1a1a2e"/>
  <circle cx="110" cy="190" r="3" fill="#1a1a2e"/>
  <path d="M75 198 Q100 205 125 198" stroke="#1a1a2e" stroke-width="2" fill="none"/>
  <text x="200" y="270" font-family="monospace" font-size="12" fill="#F57C00" text-anchor="middle">:$ help --please</text>
