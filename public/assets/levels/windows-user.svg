<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#1a1a2e"/>
  <rect x="20" y="30" width="200" height="140" rx="8" fill="#0d1117" stroke="#F57C00" stroke-width="2"/>
  <text x="30" y="50" font-family="monospace" font-size="11" fill="#ff5555">user@linux:~$ ls</text>
  <text x="30" y="65" font-family="monospace" font-size="11" fill="#ff5555">ls: command not found</text>
  <text x="30" y="80" font-family="monospace" font-size="11" fill="#ff5555">user@linux:~$ sudo apt update</text>
  <text x="30" y="95" font-family="monospace" font-size="11" fill="#ff5555">sudo: permission denied</text>
  <text x="30" y="120" font-family="monospace" font-size="11" fill="#F57C00">user@linux:~$ exit</text>
  <text x="30" y="140" font-family="monospace" font-size="9" fill="#555">[terminal closing...]</text>
  <rect x="240" y="40" width="140" height="100" rx="8" fill="#0078D4"/>
  <rect x="250" y="50" width="120" height="22" fill="#fff" rx="2"/>
