<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#0d1117"/>

  <!-- Monitoring terminal -->
  <rect x="20" y="15" width="180" height="120" rx="8" fill="#161b22" stroke="#F57C00" stroke-width="1.5"/>
  <circle cx="36" cy="29" r="3.5" fill="#ff5555"/>
  <circle cx="46" cy="29" r="3.5" fill="#FDB441"/>
  <circle cx="56" cy="29" r="3.5" fill="#22c55e"/>
  <text x="30" y="50" font-family="monospace" font-size="8" fill="#22c55e">$ htop</text>
  <rect x="28" y="56" width="164" height="6" rx="2" fill="#0d1117"/>
  <rect x="28" y="56" width="120" height="6" rx="2" fill="#F57C00"/>
  <rect x="28" y="66" width="164" height="6" rx="2" fill="#0d1117"/>
  <rect x="28" y="66" width="80" height="6" rx="2" fill="#22c55e"/>
  <rect x="28" y="76" width="164" height="6" rx="2" fill="#0d1117"/>
  <rect x="28" y="76" width="140" height="6" rx="2" fill="#FDB441"/>
  <rect x="28" y="86" width="164" height="6" rx="2" fill="#0d1117"/>
  <rect x="28" y="86" width="50" height="6" rx="2" fill="#58a6ff"/>
  <text x="28" y="106" font-family="monospace" font-size="7" fill="#888">CPU 73%  MEM 48%  NET</text>
  <text x="28" y="120" font-family="monospace" font-size="7" fill="#22c55e">Tasks: 142 running</text>

  <!-- Network topology -->
  <circle cx="210" cy="75" r="18" fill="#161b22" stroke="#F57C00" stroke-width="1.5"/>
  <text x="210" y="79" font-family="monospace" font-size="8" fill="#F57C00" text-anchor="middle">FW</text>
  <line x1="210" y1="93" x2="210" y2="130" stroke="#F57C00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="210" y1="57" x2="210" y2="30" stroke="#F57C00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="192" y1="75" x2="140" y2="75" stroke="#F57C00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="228" y1="75" x2="280" y2="75" stroke="#F57C00" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Cloud -->
  <ellipse cx="210" cy="22" rx="22" ry="10" fill="#161b22" stroke="#F57C00" stroke-width="1.5"/>
  <text x="210" y="25" font-family="monospace" font-size="7" fill="#F57C00" text-anchor="middle">CLOUD</text>

  <!-- Server row -->
  <rect x="90" y="140" width="60" height="70" rx="5" fill="#1a1a2e" stroke="#F57C00" stroke-width="1.5"/>
  <rect x="97" y="146" width="46" height="10" rx="2" fill="#161b22"/>
  <circle cx="103" cy="151" r="2" fill="#22c55e"/>
  <rect x="97" y="160" width="46" height="10" rx="2" fill="#161b22"/>
  <circle cx="103" cy="165" r="2" fill="#22c55e"/>
  <rect x="97" y="174" width="46" height="10" rx="2" fill="#161b22"/>
  <circle cx="103" cy="179" r="2" fill="#FDB441"/>
  <text x="120" y="218" font-family="monospace" font-size="7" fill="#F57C00" text-anchor="middle">WEB</text>

  <rect x="170" y="140" width="60" height="70" rx="5" fill="#1a1a2e" stroke="#F57C00" stroke-width="1.5"/>
  <rect x="177" y="146" width="46" height="10" rx="2" fill="#161b22"/>
  <circle cx="183" cy="151" r="2" fill="#22c55e"/>
  <rect x="177" y="160" width="46" height="10" rx="2" fill="#161b22"/>
  <circle cx="183" cy="165" r="2" fill="#22c55e"/>
  <rect x="177" y="174" width="46" height="10" rx="2" fill="#161b22"/>
  <circle cx="183" cy="179" r="2" fill="#22c55e"/>
  <text x="200" y="218" font-family="monospace" font-size="7" fill="#F57C00" text-anchor="middle">DB</text>

  <rect x="250" y="140" width="60" height="70" rx="5" fill="#1a1a2e" stroke="#F57C00" stroke-width="1.5"/>
  <rect x="257" y="146" width="46" height="10" rx="2" fill="#161b22"/>
  <circle cx="263" cy="151" r="2" fill="#ff5555"/>
  <rect x="257" y="160" width="46" height="10" rx="2" fill="#161b22"/>
  <circle cx="263" cy="165" r="2" fill="#22c55e"/>
  <rect x="257" y="174" width="46" height="10" rx="2" fill="#161b22"/>
  <circle cx="263" cy="179" r="2" fill="#22c55e"/>
  <text x="280" y="218" font-family="monospace" font-size="7" fill="#F57C00" text-anchor="middle">APP</text>

  <line x1="120" y1="140" x2="120" y2="130" stroke="#F57C00" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="200" y1="140" x2="200" y2="130" stroke="#F57C00" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="280" y1="140" x2="280" y2="93" stroke="#F57C00" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Containers -->
  <rect x="330" y="140" width="50" height="16" rx="3" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="355" y="151" font-family="monospace" font-size="7" fill="#58a6ff" text-anchor="middle">docker</text>
  <rect x="330" y="162" width="22" height="22" rx="3" fill="#1a1a2e" stroke="#22c55e" stroke-width="1"/>
  <text x="341" y="176" font-family="monospace" font-size="6" fill="#22c55e" text-anchor="middle">c1</text>
  <rect x="358" y="162" width="22" height="22" rx="3" fill="#1a1a2e" stroke="#22c55e" stroke-width="1"/>
  <text x="369" y="176" font-family="monospace" font-size="6" fill="#22c55e" text-anchor="middle">c2</text>
  <rect x="330" y="190" width="22" height="22" rx="3" fill="#1a1a2e" stroke="#FDB441" stroke-width="1"/>
  <text x="341" y="204" font-family="monospace" font-size="6" fill="#FDB441" text-anchor="middle">c3</text>
  <rect x="358" y="190" width="22" height="22" rx="3" fill="#1a1a2e" stroke="#FDB441" stroke-width="1"/>
  <text x="369" y="204" font-family="monospace" font-size="6" fill="#FDB441" text-anchor="middle">c4</text>

  <!-- Firewall terminal -->
  <rect x="20" y="225" width="360" height="60" rx="8" fill="#161b22" stroke="#F57C00" stroke-width="1"/>
  <text x="30" y="242" font-family="monospace" font-size="8" fill="#22c55e">$ iptables -L -n</text>
  <text x="30" y="254" font-family="monospace" font-size="7" fill="#ccc">Chain INPUT (policy DROP)</text>
  <text x="30" y="265" font-family="monospace" font-size="7" fill="#22c55e">ACCEPT  tcp  --  0.0.0.0/0  dpt:443</text>
  <text x="30" y="276" font-family="monospace" font-size="7" fill="#ff5555">DROP    all  --  0.0.0.0/0</text>
</svg>
