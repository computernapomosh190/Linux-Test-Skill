<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#0d1117"/>
  <!-- Terminal window -->
  <rect x="20" y="20" width="360" height="130" rx="10" fill="#161b22" stroke="#F57C00" stroke-width="1.5"/>
  <circle cx="38" cy="36" r="4" fill="#ff5555"/>
  <circle cx="50" cy="36" r="4" fill="#FDB441"/>
  <circle cx="62" cy="36" r="4" fill="#22c55e"/>
  <text x="80" y="40" font-family="monospace" font-size="9" fill="#888">admin@server:~$</text>
  <text x="30" y="62" font-family="monospace" font-size="10" fill="#22c55e">$ systemctl status nginx</text>
  <text x="30" y="76" font-family="monospace" font-size="9" fill="#22c55e">● nginx.service - active (running)</text>
  <text x="30" y="92" font-family="monospace" font-size="10" fill="#58a6ff">$ ssh user@192.168.1.10</text>
  <text x="30" y="108" font-family="monospace" font-size="10" fill="#F57C00">$ journalctl -u ssh --since today</text>
  <text x="30" y="124" font-family="monospace" font-size="9" fill="#ccc">-- Logs begin at 2026-10-04 --</text>
  <text x="30" y="138" font-family="monospace" font-size="10" fill="#22c55e">$ ip addr show</text>

  <!-- Server rack -->
  <rect x="40" y="170" width="90" height="110" rx="6" fill="#1a1a2e" stroke="#F57C00" stroke-width="1.5"/>
  <rect x="48" y="178" width="74" height="16" rx="3" fill="#161b22"/>
  <circle cx="56" cy="186" r="2.5" fill="#22c55e"/>
  <circle cx="64" cy="186" r="2.5" fill="#22c55e"/>
  <rect x="48" y="200" width="74" height="16" rx="3" fill="#161b22"/>
  <circle cx="56" cy="208" r="2.5" fill="#FDB441"/>
  <circle cx="64" cy="208" r="2.5" fill="#22c55e"/>
  <rect x="48" y="222" width="74" height="16" rx="3" fill="#161b22"/>
  <circle cx="56" cy="230" r="2.5" fill="#22c55e"/>
  <circle cx="64" cy="230" r="2.5" fill="#22c55e"/>
  <rect x="48" y="244" width="74" height="16" rx="3" fill="#161b22"/>
  <circle cx="56" cy="252" r="2.5" fill="#ff5555"/>
  <circle cx="64" cy="252" r="2.5" fill="#22c55e"/>
  <text x="85" y="288" font-family="monospace" font-size="8" fill="#F57C00" text-anchor="middle">SRV-01</text>

  <!-- Network lines -->
  <line x1="130" y1="210" x2="180" y2="210" stroke="#F57C00" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="180" cy="210" r="15" fill="#161b22" stroke="#F57C00" stroke-width="1.5"/>
  <text x="180" y="214" font-family="monospace" font-size="8" fill="#F57C00" text-anchor="middle">NET</text>
  <line x1="195" y1="210" x2="240" y2="210" stroke="#F57C00" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Second server -->
  <rect x="240" y="170" width="80" height="90" rx="6" fill="#1a1a2e" stroke="#F57C00" stroke-width="1.5"/>
  <rect x="248" y="178" width="64" height="14" rx="3" fill="#161b22"/>
  <circle cx="255" cy="185" r="2.5" fill="#22c55e"/>
  <rect x="248" y="198" width="64" height="14" rx="3" fill="#161b22"/>
  <circle cx="255" cy="205" r="2.5" fill="#22c55e"/>
  <rect x="248" y="218" width="64" height="14" rx="3" fill="#161b22"/>
  <circle cx="255" cy="225" r="2.5" fill="#FDB441"/>
  <text x="280" y="285" font-family="monospace" font-size="8" fill="#F57C00" text-anchor="middle">SRV-02</text>

  <!-- Penguin admin -->
  <ellipse cx="350" cy="230" rx="20" ry="28" fill="#1a1a2e" stroke="#F57C00" stroke-width="1.5"/>
  <ellipse cx="350" cy="225" rx="14" ry="20" fill="#fff"/>
  <circle cx="345" cy="220" r="3" fill="#1a1a2e"/>
  <circle cx="355" cy="220" r="3" fill="#1a1a2e"/>
  <path d="M343 228 Q350 233 357 228" stroke="#F57C00" stroke-width="1.5" fill="#FDB441"/>
</svg>
